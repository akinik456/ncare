name: ncare
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
    
  flutter_localizations:
    sdk: flutter
  intl: any # Tarih, saat ve sayı formatları için şart

 
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  cupertino_icons: ^1.0.8
  firebase_messaging: ^16.1.2
  permission_handler: ^12.0.1
  geolocator: ^14.0.2
  shared_preferences: ^2.5.4
  cloud_firestore: ^6.1.3
  url_launcher: ^6.3.2
  geocoding: ^4.0.0
  uuid: ^4.5.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.0
  battery_plus: ^7.0.0
  flutter_local_notifications: ^17.0.0
  flutter_background_service: ^5.0.7
  google_api_availability: ^5.0.1
  sensors_plus: ^7.0.0
  pedometer: ^4.2.0
  device_info_plus: ^10.1.0
  android_intent_plus: ^5.0.2
  restart_app: ^1.2.1
  flutter_native_splash: ^2.4.0
 
  
  firebase_core: any
  firebase_auth: ^6.3.0
  firebase_database: ^12.2.0
  flutter_launcher_icons: ^0.14.4
dev_dependencies:
  flutter_test:
    sdk: flutter


  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  
l10n:
  arb-dir: lib/l10n
  template-arb-file: app_en.arb
  output-localization-file: app_localizations.dart  
  
flutter_native_splash:
  color: "#0F172A" # Senin koyu lacivert/siyah tonun
  image: assets/images/logo.png # Logonun yolu
    
  android_12:
    image: assets/images/logo.png
    color: "#0F172A"
    
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo.png"
  min_sdk_android: 21 # Android 5.0 ve üzeri için standart
  
  # Android 8.0+ için "Adaptive Icon" (Daire/Kare uyumu)
  adaptive_icon_background: "#0F172A" # Arka plan rengin
  adaptive_icon_foreground: "assets/images/logo.png" # Logon    
